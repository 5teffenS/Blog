<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article 01</title>

    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
</head>

<body id="article01">
    <section class="carousel-slider">
        <div class="carousel-slider-element">
            <img src="../assets/img/Carousel_beach_05.jpg" alt="picture of a beach">
        </div>
        <div class="carousel-slider-element">
            <img src="../assets/img/Carousel_beach_03.jpg" alt="picture of a beach">
        </div>
        <div class="carousel-slider-element">
            <img src="../assets/img/Carousel_beach_02.jpg" alt="picture of a beach">
        </div>
        <div class="carousel-slider-element">
            <img src="../assets/img/Carousel_beach_01.jpg" alt="picture of a beach">
        </div>
        <div class="carousel-slider-element">
            <img src="../assets/img/Carousel_woman.jpg" alt="picture of a beach">
        </div>
    </section>

    <section class="share-section">
        <p>Follow me for more content like this, and share the article with your friends!</p>
        <img src="../assets/img/arrow.svg" alt="Pfeil zeigt auf Share Button">
        <div class="share-wrapper">

            <input type="checkbox" id="share-toggle">

            <label for="share-toggle" class="icon-btn">
                <img class="share-icon" src="../assets/icons/share.svg" alt="share icon">
                Share
            </label>

            <div class="share-expanded">

                <img src="../assets/icons/share_green.svg" alt="share icon">

                <div class="share-links">
                    <a href="https://www.facebook.com/" target="_blank">LinkedIn</a>
                    <a href="https://www.facebook.com/" target="_blank">Facebook</a>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
