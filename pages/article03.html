<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="../styles/style.css">

<body>

    <!---------------------HEADER-------------------------------------------------------------------------->


    <header>

        <a href="../index.html"><img src="../assets/img/logo.png" alt="logo"></a>

            <img src="../assets/img/arrow.svg" alt="Pfeil zeigt auf Share Button">

                <div class="share-expanded">

    </content>

            <a href="https://www.facebook.com" target="_blank"><img src="../assets/icons/facebook.svg"
